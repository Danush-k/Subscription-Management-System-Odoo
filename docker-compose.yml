version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: brightloop-postgres
    restart: always
    environment:
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: brightloop_secure_password
      POSTGRES_DB: brightloop_subscriptions
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightloop -d brightloop_subscriptions"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: brightloop-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
